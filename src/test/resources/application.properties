# Test-only configuration - in-memory H2 so the test suite never depends on
# a real Postgres instance being reachable.

spring.datasource.url=jdbc:h2:mem:foodwaste-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

jwt.secret=test-only-secret-not-used-outside-the-test-suite-1234567890
jwt.expiration-ms=3600000

app.cors.allowed-origins=http://localhost:4200
