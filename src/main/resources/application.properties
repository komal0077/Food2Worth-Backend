spring.application.name=FoodWaste

# ===============================
# Database
# ===============================
# Credentials must never be committed. Set DB_URL / DB_USERNAME / DB_PASSWORD
# as real environment variables in every environment (local, CI, prod).
# The Neon password that used to be hardcoded here was exposed in source and
# must be rotated in the Neon console regardless of git history.

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/foodwaste}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# PostgreSQL Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${PORT:8080}

# ===============================
# JWT
# ===============================
# Must be overridden via the JWT_SECRET env var in any real deployment - the
# fallback below is for local dev only and is intentionally not secret.
jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-before-deploying-1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:36000000}

# ===============================
# CORS
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}